<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pokemon EN -> JP Index</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="main-pane">
        <header class="topbar">
          <div>
            <h1>Pokemon Name Index</h1>
            <p>英語名から日本語名をすぐ確認</p>
          </div>
          <div class="topbar-actions">
            <button id="installButton" class="install-button" type="button" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4" />
                <path d="M5 17v3h14v-3" />
              </svg>
              <span>Install</span>
            </button>
            <div class="counter" aria-live="polite">
              <strong id="matchCount">1025</strong>
              <span>results</span>
            </div>
          </div>
        </header>

        <section class="search-panel" aria-label="検索">
          <div class="search-box">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
            </svg>
            <input
              id="searchInput"
              type="text"
              placeholder="English name..."
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              autofocus
            />
            <button id="clearButton" class="icon-button" type="button" aria-label="検索をクリア">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M18 6L6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div id="activeLetter" class="active-letter">All</div>
        </section>

        <section id="favoritesBar" class="favorites-bar" aria-label="お気に入り"></section>
        <section id="results" class="results" aria-label="検索結果"></section>
      </main>

      <aside class="detail-pane" aria-label="選択中のポケモン">
        <div class="detail-card">
          <div class="detail-kicker">Selected</div>
          <div class="detail-number" id="detailNumber">#001</div>
          <h2 id="detailEnglish">Bulbasaur</h2>
          <div id="detailJapanese" class="detail-japanese">フシギダネ</div>
          <div id="detailTypes" class="type-stack"></div>
          <button id="copyButton" class="copy-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 8h10v12H8z" />
              <path d="M6 16H4V4h12v2" />
            </svg>
            <span>日本語名をコピー</span>
          </button>
          <div id="copyStatus" class="copy-status" aria-live="polite"></div>
        </div>
      </aside>

      <aside id="letterRail" class="letter-rail" aria-label="アルファベット索引">
        <div id="letterBubble" class="letter-bubble" aria-hidden="true">A</div>
        <div class="rail-title">A-Z</div>
        <div id="letterButtons" class="letter-buttons"></div>
      </aside>
    </div>

    <div id="detailModal" class="modal-shell" role="dialog" aria-modal="true" aria-labelledby="modalEnglish" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <article class="modal-card">
        <header class="modal-header">
          <div>
            <div id="modalNumber" class="modal-number">#0001</div>
            <h2 id="modalEnglish">Bulbasaur</h2>
            <div id="modalJapanese" class="modal-japanese">フシギダネ</div>
            <div id="modalTypes" class="type-stack"></div>
          </div>
          <div class="modal-actions">
            <button id="favoriteButton" class="star-button" type="button" aria-label="お気に入りに追加">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m12 3.5 2.7 5.47 6.03.88-4.37 4.26 1.03 6.01L12 17.29l-5.39 2.83 1.03-6.01-4.37-4.26 6.03-.88L12 3.5Z" />
              </svg>
            </button>
            <button class="icon-button" type="button" aria-label="詳細を閉じる" data-close-modal>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M18 6L6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
        </header>

        <section id="modalBasics" class="detail-grid" aria-label="基本情報"></section>
        <section class="modal-section">
          <h3>Pokemon Unbound Evolution</h3>
          <div id="modalEvolution" class="evolution-list"></div>
        </section>
        <section class="modal-section">
          <h3>Type Chart (Defensive)</h3>
          <div id="modalTypeChart" class="type-chart"></div>
        </section>
        <section class="modal-section">
          <h3>Quick Stats</h3>
          <div id="modalStats" class="stat-list"></div>
        </section>
      </article>
    </div>

    <script src="./pokemon-data.js"></script>
    <script src="./pokemon-details.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
